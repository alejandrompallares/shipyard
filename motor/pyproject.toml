[project]
name = "motor-notas"
version = "0.1.0"
description = "Servidor MCP de búsqueda sobre una bóveda de notas Markdown (Jylos/Obsidian): palabras, significado, grafo y duplicados."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.3,<3",
  "numpy>=1.24",
  "onnxruntime>=1.17",
  "tokenizers>=0.15",
  "huggingface-hub>=0.20",
]

[project.scripts]
motor-notas = "motor_notas.cli:main"

[dependency-groups]
dev = ["pytest>=8", "onnx>=1.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motor_notas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
