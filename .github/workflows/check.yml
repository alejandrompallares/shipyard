name: Comprobaciones

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # JSON válidos, versiones iguales, zip = carpeta logbook, rutas citadas existentes
      - name: Comprobar el repo
        run: python3 scripts/check.py
